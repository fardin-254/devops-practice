name: Central Portfolio Deployment

on:
  repository_dispatch:
    types: [portfolio-deploy]
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Application Code (sokratix-portfolio)
        uses: actions/checkout@v4
        with:
          repository: fardin-254/sokratix-portfolio
          ref: dev

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sokratix-portfolio
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Log in to AWS ECR on EC2
            aws ecr get-login-password --region ${{ secrets.AWS_REGION || 'ap-south-1' }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # 2. Pull the newly pushed image
            docker pull ${{ steps.login-ecr.outputs.registry }}/sokratix-portfolio:latest

            # 3. Write production environment file
            cat << 'EOF' > ~/.portfolio.env
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            NODE_ENV=production
            PORT=3000
            HOSTNAME=0.0.0.0
            EOF

            # 4. Stop and remove existing container if running
            docker stop portfolio || true
            docker rm portfolio || true

            # 5. Start new container bound directly to Port 80 (HTTP)
            docker run -d \
              --name portfolio \
              --restart always \
              -p 80:3000 \
              --env-file ~/.portfolio.env \
              ${{ steps.login-ecr.outputs.registry }}/sokratix-portfolio:latest

            # 6. Verify deployment
            docker ps
